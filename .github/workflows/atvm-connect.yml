name: ATVM Connect (APK)

# Compile l'appli Android TV. Un tag "connect-vX.Y.Z" publie l'APK dans une release GitHub,
# téléchargeable ensuite à l'adresse fixe : releases/latest/download/atvm-connect.apk
on:
  push:
    tags: ['connect-v*']
    paths-ignore: []
  pull_request:
    paths: ['agent/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ATVM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/atvm.p12"
            echo "ATVM_KEYSTORE=$RUNNER_TEMP/atvm.p12" >> "$GITHUB_ENV"
          else
            echo "Pas de clé : APK signée avec la clé de debug"
          fi

      - name: Version
        run: |
          V="${GITHUB_REF_NAME#connect-v}"
          [ "$V" = "$GITHUB_REF_NAME" ] && V="0.0.0-dev"
          echo "ATVM_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "ATVM_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Compilation
        env:
          ATVM_KEYSTORE_PASSWORD: ${{ secrets.ATVM_KEYSTORE_PASSWORD }}
        run: gradle -p agent assembleRelease --no-daemon --stacktrace

      - run: cp agent/app/build/outputs/apk/release/app-release.apk atvm-connect.apk

      - uses: actions/upload-artifact@v4
        with:
          name: atvm-connect
          path: atvm-connect.apk

      - name: Publication
        if: startsWith(github.ref, 'refs/tags/connect-v')
        uses: softprops/action-gh-release@v2
        with:
          files: atvm-connect.apk
          name: ATVM Connect ${{ env.ATVM_VERSION_NAME }}
          make_latest: true
          body: |
            Appli à installer sur la TV pour la relier à ATV Manager à distance.
            Sur la TV : Downloader → adresse de ton ATV Manager suivie de /connect.apk
